[project]
name = "dumps-or-fire"
version = "2.0"
description = "Music Popularity Getter Website"
authors = [
    { name = "Josh Holman", email = "git@jolman.me" },
    { name = "Brandon Cobb" },
    { name = "Jarred Siriban" }
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apple-music-python>=1.0.6",
    "fastapi[standard]>=0.136.1",
    "pydantic>=2.13.3",
]

[project.urls]
Homepage = "https://github.com/thejolman/dumps-or-fire"

[dependency-groups]
dev = [
    "ruff",
]


